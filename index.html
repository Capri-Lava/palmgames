<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>palmgames</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4efe6; --card:#fffaf2; --ink:#1f1a14; --muted:#7a6f62; --line:#e3d9c9; --accent:#d9542b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#17140f; --card:#221e17; --ink:#f3ece0; --muted:#a59a89; --line:#3a3328; --accent:#ef6f45; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 Inter, system-ui, sans-serif;
         padding:max(16px, env(safe-area-inset-top)) 16px 16px; display:flex; justify-content:center; }
  main { width:100%; max-width:440px; }
  h1 { font-family:Fraunces, Georgia, serif; font-weight:800; font-size:36px; margin:8px 0 4px; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 20px; }
  a.game { display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit;
           background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px 20px; margin-bottom:12px; }
  a.game .e { font-size:40px; }
  a.game b { display:block; font-size:18px; }
  a.game span { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>palm<span style="color:var(--accent)">games</span></h1>
  <p>Proste gry na dwa telefony.</p>
  <a class="game" href="rps/">
    <div class="e">✌️</div>
    <div><b>Kamień Papier Nożyce</b><span>2 graczy online · albo z komputerem</span></div>
  </a>
</main>
</body>
</html>
