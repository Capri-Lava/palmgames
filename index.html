<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="palm games">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<title>palm games</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --ink: #0b0b0b; --muted: #8c8c8c; --soft: #f3f3f3; --line: #e6e6e6;
    --inv-bg: #0b0b0b; --inv-ink: #ffffff;
    --emoji: grayscale(1) contrast(1.12);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0b; --ink: #f5f5f5; --muted: #7d7d7d; --soft: #171717; --line: #262626;
      --inv-bg: #f5f5f5; --inv-ink: #0b0b0b; --emoji: grayscale(1) contrast(1.05) brightness(1.05);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.35 "Inter Tight", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased;
  }
  .e { filter: var(--emoji); font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; line-height: 1; display: inline-block; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; }
  input {
    font: inherit; font-size: 17px; color: var(--ink); background: var(--soft);
    border: 0; border-radius: 14px; padding: 14px 16px; width: 100%; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  input:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
  input::placeholder { color: var(--muted); }
  .hidden { display: none !important; }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    max-width: 520px; margin: 0 auto; animation: in .35s var(--ease);
  }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 17px 18px; border-radius: 16px; font-weight: 600; font-size: 17px;
    background: var(--inv-bg); color: var(--inv-ink); transition: transform .12s var(--ease), opacity .2s;
  }
  .btn:active { transform: scale(.975); }
  .btn.sec { background: var(--soft); color: var(--ink); }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; color: var(--ink); flex: none; }
  .icon-btn:active { background: var(--soft); }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .err { color: var(--ink); font-size: 14px; min-height: 18px; margin: 0; font-weight: 500; }

  /* ---------- WEKTOROWA DŁOŃ (z boku, od środka: kciuk na górze, pod nim 4 palce) ---------- */
  .hs { display: block; overflow: visible; }
  .hs .f, .hs .th, .hs .palm { fill: var(--bg); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
  .hs .cuff { fill: var(--ink); }
  .hs .body { transform-box: view-box; transform-origin: 40px 90px; transition: transform .28s cubic-bezier(.3,1.3,.5,1); }
  .hs .f, .hs .th { transform-box: fill-box; transform-origin: 0% 50%; transition: transform .2s cubic-bezier(.3,1.4,.5,1); }
  .hs .f1 { --c: .427; } .hs .f2 { --c: .438; } .hs .f3 { --c: .45; } .hs .f4 { --c: .49; }
  .hs .f { transform: scaleX(var(--c)); }
  /* palec */
  .hs[data-g="one"] .f1 { transform: none; }
  /* dwa palce */
  .hs[data-g="two"] .f1 { transform: rotate(-9deg); }
  .hs[data-g="two"] .f2 { transform: rotate(7deg); }
  /* ściana — palce złożone razem */
  .hs[data-g="wall"] .f { transform: none; }
  .hs[data-g="wall"] .th { transform: translateX(14px); }
  /* słońce — szeroko rozczapierzone */
  .hs[data-g="sun"] .f1 { transform: rotate(-30deg); }
  .hs[data-g="sun"] .f2 { transform: rotate(-10deg); }
  .hs[data-g="sun"] .f3 { transform: rotate(10deg); }
  .hs[data-g="sun"] .f4 { transform: rotate(30deg); }
  .hs[data-g="sun"] .th { transform: translate(-6px, -4px) rotate(-38deg); }
  /* daszek — dłoń obrócona, palce w dół jak dach / parasol / góra */
  .hs[data-g="roof"] .body { transform: rotate(-30deg); }
  .hs[data-g="roof"] .f { transform: translateX(46px) rotate(64deg); }
  .hs[data-g="roof"] .th { transform: translateX(12px); }
  /* fala — płaska dłoń, która faluje */
  .hs[data-g="wave"] .f { transform: none; }
  .hs[data-g="wave"] .th { transform: translateX(14px); }
  .hs[data-g="wave"] .body { animation: wv 1.3s ease-in-out infinite; }
  .hs[data-g="wave"] .f { animation: wvf 1.3s ease-in-out infinite; }
  @keyframes wv { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(10deg); } }
  @keyframes wvf { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(-16deg); } }
  .hs.static[data-g="wave"] .body { animation: none; transform: rotate(-10deg); }
  .hs.static[data-g="wave"] .f { animation: none; transform: rotate(16deg); }
  .hs.static .f, .hs.static .th, .hs.static .body { transition: none; }
  .hs.thin .f, .hs.thin .th, .hs.thin .palm { stroke-width: 9; }

  /* ---------- HOME ---------- */
  .logo { font-size: 22px; letter-spacing: -.03em; margin: 6px 0 0; }
  .logo b { font-weight: 900; } .logo span { font-weight: 400; color: var(--muted); }
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; min-height: 220px; }
  .hero .wrap { width: clamp(170px, 30vh, 240px); transform-origin: 8% 60%; animation: wave 3.6s infinite; }
  @keyframes wave {
    0%    { transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(.2,.7,.3,1); }
    8.33% { transform: translateY(-22px) rotate(-8deg); animation-timing-function: cubic-bezier(.6,0,.9,.4); }
    16.67%{ transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(.2,.7,.3,1); }
    25%   { transform: translateY(-22px) rotate(-8deg); animation-timing-function: cubic-bezier(.6,0,.9,.4); }
    33.33%{ transform: translateY(0) rotate(0); animation-timing-function: cubic-bezier(.2,.7,.3,1); }
    41.67%{ transform: translateY(-22px) rotate(-8deg); animation-timing-function: cubic-bezier(.6,0,.9,.4); }
    50%   { transform: translateY(0) rotate(0); }
    100%  { transform: translateY(0) rotate(0); }
  }
  /* na „trzy” wyskakują dwa palce, potem znowu pięść */
  .hero .hs .f1 { animation: v1 3.6s infinite; transition: none; }
  .hero .hs .f2 { animation: v2 3.6s infinite; transition: none; }
  @keyframes v1 { 0%, 49% { transform: scaleX(var(--c)); } 52%, 86% { transform: rotate(-9deg); } 91%, 100% { transform: scaleX(var(--c)); } }
  @keyframes v2 { 0%, 49% { transform: scaleX(var(--c)); } 52%, 86% { transform: rotate(7deg); } 91%, 100% { transform: scaleX(var(--c)); } }
  .rhythm { display: flex; gap: 16px; font-weight: 900; font-size: 15px; letter-spacing: .06em; color: var(--line); }
  .rhythm span { animation: beat 3.6s linear infinite; }
  .rhythm span:nth-child(1) { animation-delay: .6s; }
  .rhythm span:nth-child(2) { animation-delay: 1.2s; }
  .rhythm span:nth-child(3) { animation-delay: 1.8s; }
  @keyframes beat { 0%, 14% { color: var(--ink); } 20%, 100% { color: var(--line); } }
  .menu { display: flex; flex-direction: column; }
  .row-btn {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    padding: 16px 4px; border-bottom: 1px solid var(--line); text-align: left; transition: opacity .15s;
  }
  .row-btn:active { opacity: .5; }
  .row-btn b { display: block; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .row-btn small { color: var(--muted); font-size: 14px; }
  .row-btn .arr { font-size: 20px; color: var(--muted); }
  .join { display: flex; gap: 8px; margin-top: 16px; }
  .join input.code { flex: 1; text-transform: uppercase; letter-spacing: .32em; text-align: center; font-weight: 700; }
  .join .btn { width: auto; padding: 0 22px; }
  #joinName { margin-top: 8px; }

  /* ---------- SETUP ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 44px; margin: 0 -8px; flex: none; }
  .topbar .t { font-weight: 600; font-size: 15px; }
  h2 { font-size: 34px; font-weight: 800; letter-spacing: -.035em; line-height: 1.02; margin: 10px 0 22px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--soft); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { padding: 11px 0; border-radius: 11px; font-weight: 600; font-size: 15px; color: var(--muted); transition: background .2s, color .2s; }
  .seg button.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 .5px var(--line); }
  .preview { margin: 18px 0 8px; padding: 18px; border-radius: 18px; border: 1px solid var(--line); }
  .preview .pname { font-weight: 700; font-size: 17px; }
  .preview .tri { display: flex; justify-content: space-between; margin: 16px 0 14px; }
  .preview .tri > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .preview .tri .e { font-size: 38px; }
  .preview .tri .hs { width: 40px; }
  .preview .tri small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .rules { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .rules b { color: var(--ink); font-weight: 600; }
  .vlist { display: flex; flex-direction: column; margin-top: 8px; }
  .vitem { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
  .vitem .n { font-weight: 600; font-size: 16px; }
  .vitem .em { font-size: 22px; letter-spacing: 6px; }
  .vitem .chk { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); margin-left: 12px; flex: none; display: grid; place-items: center; font-size: 12px; }
  .vitem.on .chk { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .setup-foot { padding-top: 14px; }

  /* ---------- WAITING ---------- */
  .bigcode { font-size: clamp(64px, 22vw, 96px); font-weight: 900; letter-spacing: .08em; text-align: center; margin: 0; line-height: 1; }
  .wait-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; text-align: center; }
  .dots::after { content: ""; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  /* ---------- GAME ---------- */
  .game { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); gap: 8px; }
  .gbar { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; flex: none; margin: 0 -4px; height: 40px; }
  .vname { text-align: center; font-size: 13px; color: var(--muted); font-weight: 600; }

  /* pojedynek: Ty  [gest] wybór   0 : 1   wybór [gest]  Rywal */
  .duel { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 8px; }
  .duel .side {
    border-radius: 18px; background: var(--soft); padding: 10px 12px; min-width: 0;
    display: flex; flex-direction: column; gap: 6px; transition: background .25s, color .25s, opacity .3s;
  }
  .duel .side.opp { align-items: flex-end; text-align: right; }
  .duel .nm { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .duel .pk { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 64px; max-width: 100%; }
  .duel .side.opp .pk { align-items: flex-end; }
  .duel .ic { flex: none; display: grid; place-items: center; width: 46px; height: 30px; }
  .duel .ic .hs { width: 46px; }
  .duel .ic .e { font-size: 28px; }
  .duel .tx { font-size: 19px; font-weight: 900; letter-spacing: -.02em; line-height: 1.05; overflow-wrap: anywhere; }
  .duel .tx.wait { font-size: 15px; font-weight: 600; color: var(--muted); }
  .duel .side.win { background: var(--inv-bg); color: var(--inv-ink); }
  .duel .side.win .nm { color: var(--inv-ink); opacity: .7; }
  .duel .side.win .hs .f, .duel .side.win .hs .th, .duel .side.win .hs .palm { fill: var(--inv-bg); stroke: var(--inv-ink); }
  .duel .side.win .hs .cuff { fill: var(--inv-ink); }
  .duel .side.lose { opacity: .4; }
  .duel .side.pop .ic { animation: pop .42s var(--ease); }
  .duel .sc { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 34px; letter-spacing: -.03em; padding: 0 2px; }
  .duel .sc i { font-style: normal; color: var(--muted); font-weight: 400; }
  .duel .sc span { display: inline-block; min-width: 20px; text-align: center; }
  .duel .sc span.bump { animation: bump .5s var(--ease); }
  @keyframes bump { 30% { transform: scale(1.5); } }
  .lost { opacity: .32; }

  .panel { flex: none; display: flex; flex-direction: column; gap: 8px; }
  .panel.top { transform: rotate(180deg); }
  .meta { display: flex; justify-content: space-between; padding: 0 4px; font-weight: 600; font-size: 14px; }
  .meta .pts { font-weight: 900; }
  .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; position: relative; }
  .opt {
    border-radius: 18px; background: var(--soft); padding: 10px 4px 9px; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; min-height: 86px;
    transition: transform .14s var(--ease), opacity .25s, background .2s, color .2s;
  }
  .opt .e { font-size: clamp(30px, 5vh, 40px); }
  .opt .hs { width: clamp(34px, 5.4vh, 44px); }
  .opt .tag { position: absolute; top: 7px; right: 8px; width: 17px; opacity: .55; }
  .opt small { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
  .opt:disabled { opacity: .3; }
  .opt:not(:disabled):active { transform: scale(.94); }
  .opt.sel { background: var(--inv-bg); color: var(--inv-ink); opacity: 1 !important; }
  .opt.sel .hs .f, .opt.sel .hs .th, .opt.sel .hs .palm { fill: var(--inv-bg); stroke: var(--inv-ink); }
  .opt.sel .hs .cuff { fill: var(--inv-ink); }
  .opts .veil {
    position: absolute; inset: 0; border-radius: 18px; background: var(--inv-bg); color: var(--inv-ink);
    display: grid; place-items: center; font-weight: 700; font-size: 15px;
  }

  .stage { flex: 1; position: relative; display: flex; flex-direction: column; min-height: 0; }
  .half { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; gap: clamp(6px, 1.4vh, 14px); position: relative; }
  .half.top { transform: rotate(180deg); }
  .stage:not(.split) .half.top { display: none; }
  .hand { position: relative; width: clamp(190px, 62vw, 270px); transform-origin: 8% 60%; will-change: transform; transition: opacity .3s; flex: none; }
  .split .hand { width: clamp(140px, 42vw, 200px); }
  .hand .badge {
    position: absolute; right: -6%; top: -16%; width: 30%; aspect-ratio: 1; border-radius: 50%;
    background: var(--bg); border: 3px solid var(--ink); display: grid; place-items: center;
    font-size: clamp(22px, 4.4vh, 38px); transform: scale(0); transition: transform .3s cubic-bezier(.3,1.5,.5,1);
  }
  .hand .badge.on { transform: scale(1); }
  .say { text-align: center; min-height: clamp(70px, 13vh, 120px); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding: 0 6px; }
  .split .say { min-height: 64px; }
  .word { font-size: clamp(36px, 7vh, 60px); font-weight: 900; letter-spacing: -.035em; line-height: 1; }
  .word.hit { animation: hit .26s var(--ease); }
  @keyframes hit { from { transform: scale(1.4); opacity: .15; } }
  .hint { font-size: 15px; color: var(--muted); font-weight: 500; }
  .played { font-size: 17px; font-weight: 700; color: var(--muted); }
  .played b { color: var(--ink); }
  .verdict { font-size: clamp(25px, 4.6vh, 36px); font-weight: 900; letter-spacing: -.03em; line-height: 1.05; max-width: 340px; }
  .split .verdict { font-size: clamp(19px, 3vh, 26px); }
  .point { font-size: 15px; font-weight: 700; margin-top: 4px; padding: 5px 12px; border-radius: 99px; background: var(--inv-bg); color: var(--inv-ink); }
  .point.neutral { background: var(--soft); color: var(--ink); }
  .say > * { animation: in .3s var(--ease) both; }

  .divider { flex: none; height: 3px; margin: 0 12%; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; opacity: 0; transition: opacity .2s; }
  .divider.on { opacity: 1; }
  .divider i { position: absolute; inset: 0; background: var(--ink); transform-origin: left; }
  .stage:not(.split) .divider { position: absolute; left: 0; right: 0; bottom: 4px; }

  .tapnext { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 12px; color: var(--muted); font-weight: 500; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .tapnext.on { opacity: 1; }

  .flash { position: fixed; inset: 0; background: #fff; pointer-events: none; opacity: 0; z-index: 50; }
  .flash.on { animation: flash .3s ease-out; }
  @keyframes flash { 0%, 20% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes pop { 0% { transform: scale(.5); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

  .banner {
    position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%);
    background: var(--inv-bg); color: var(--inv-ink); padding: 10px 16px; border-radius: 99px;
    font-size: 14px; font-weight: 600; z-index: 40; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- KONIEC MECZU ---------- */
  .over {
    position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 85%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    display: flex; align-items: flex-end; justify-content: center; animation: fade .3s ease;
  }
  @keyframes fade { from { opacity: 0; } }
  .sheet { width: 100%; max-width: 520px; padding: 28px 22px max(22px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; animation: up .4s var(--ease); }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  .sheet .big { font-size: 42px; font-weight: 900; letter-spacing: -.04em; line-height: 1; margin: 0; }
  .sheet .final { font-size: 88px; font-weight: 900; letter-spacing: -.05em; line-height: 1; margin: 10px 0 14px; }
  .sheet .final span { color: var(--muted); font-weight: 400; }
  .sheet .text { color: var(--muted); margin: 0 0 6px; }
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen">
  <div class="logo"><b>palm</b> <span>games</span></div>
  <div class="hero">
    <div class="wrap" id="heroHand"></div>
    <div class="rhythm"><span>RAZ</span><span>DWA</span><span>TRZY</span></div>
  </div>
  <div class="menu">
    <button class="row-btn" data-mode="split"><span><b>Jeden telefon</b><small>Dwie osoby, ekran na pół</small></span><span class="arr">→</span></button>
    <button class="row-btn" data-mode="bot"><span><b>Z komputerem</b><small>Sam na sam z maszyną</small></span><span class="arr">→</span></button>
    <button class="row-btn" data-mode="online"><span><b>Online</b><small>Dwa telefony, link lub kod</small></span><span class="arr">→</span></button>
  </div>
  <div class="join">
    <input id="joinCode" class="code" maxlength="4" placeholder="KOD" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="btn" id="btnJoin">Dołącz</button>
  </div>
  <input id="joinName" class="hidden" maxlength="16" placeholder="Twoje imię" autocomplete="off">
  <p class="err" id="homeErr"></p>
</section>

<!-- SETUP -->
<section id="setup" class="screen hidden">
  <div class="topbar">
    <button class="icon-btn" id="setupBack" aria-label="Wstecz">←</button>
    <span class="t" id="setupMode"></span>
    <span style="width:40px"></span>
  </div>
  <div class="scroll" style="flex:1; margin: 0 -4px; padding: 0 4px;">
    <h2>W co<br>gramy?</h2>

<!-- GAME -->
<section id="game" class="screen game hidden">
  <div class="gbar">
    <button class="icon-btn" id="btnQuit" aria-label="Menu">✕</button>
    <div class="vname" id="vname"></div>

  </div>

  <!-- kto co zagrał + wynik, w jednej linii -->
  <div class="duel">
    <div class="side me" id="dMe"><div class="nm" id="nmMe"></div><div class="pk"><span class="ic" id="icMe"></span><span class="tx wait" id="txMe"></span></div></div>
    <div class="sc"><span id="scMe">0</span><i>:</i><span id="scOpp">0</span></div>
    <div class="side opp" id="dOpp"><div class="nm" id="nmOpp"></div><div class="pk"><span class="ic" id="icOpp"></span><span class="tx wait" id="txOpp"></span></div></div>
  </div>

  <!-- drugi gracz na tym samym telefonie (obrócony) -->
  <div class="panel top" id="pTop">
    <div class="opts" id="oTop"></div>
    <div class="meta"><span id="nTop"></span><span class="pts" id="ptTop"></span></div>
  </div>

  <div class="stage" id="stage">
    <div class="half top">
      <div class="hand" id="hTop"></div>
      <div class="say" id="sayTop"></div>
    </div>
    <div class="divider" id="bar"><i></i></div>
    <div class="half bottom">
      <div class="hand" id="hBot"></div>
      <div class="say" id="sayBot"></div>

    <div class="tapnext" id="tapnext">dotknij, by grać dalej</div>

  <div class="panel bottom" id="pBot">
    <div class="opts" id="oBot"></div>
  </div>
</section>

<div class="over hidden" id="over">
  <div class="sheet">
    <p class="big" id="overTitle"></p>
    <p class="final" id="overScore"></p>
    <p class="text" id="overText"></p>
    <button class="btn" id="btnAgain">Zagraj ponownie</button>
    <button class="btn sec" id="btnAgainRandom">Ponownie, losowy wariant</button>
    <button class="btn sec" id="btnMenu">Menu</button>
  </div>
</div>

<div class="flash" id="flash"></div>
<div class="banner hidden" id="banner"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  'use strict';
  // =====================================================================
  //  DŁOŃ (SVG) — gesty: fist (pięść), one (palec), two (dwa palce), five (dłoń)
  // =====================================================================
  const handSVG = (g = 'fist', cls = '') => `<svg class="hs ${cls}" viewBox="0 0 260 170" data-g="${g}" aria-hidden="true"><g class="body">
    <rect class="cuff" x="2" y="50" width="46" height="76" rx="8"/>
    <rect class="palm" x="34" y="40" width="120" height="100" rx="38"/>
    <rect class="f f4" x="92" y="116" width="118" height="20" rx="10"/>
    <rect class="f f3" x="92" y="95" width="138" height="21" rx="10.5"/>
    <rect class="f f2" x="92" y="73" width="146" height="22" rx="11"/>
    <rect class="f f1" x="92" y="51" width="150" height="22" rx="11"/>
    <rect class="th" x="66" y="33" width="68" height="21" rx="10.5"/>
  </g></svg>`;
  const GEST_NAME = { fist: 'pięść', one: 'palec', two: 'dwa palce', wall: 'płaska dłoń', sun: 'rozczapierzona', roof: 'daszek', wave: 'fala' };
  $id('heroHand').innerHTML = handSVG('fist');
  function $id(id) { return document.getElementById(id); }

  // =====================================================================
  //  WARIANTY
  // =====================================================================
  const I = (n, e, z, plural) => ({ n, e, z, w: plural ? 'wygrywają' : 'wygrywa' });
  const V = (id, name, items, beats, g) => ({ id, name, items, beats, g });
  const VARIANTS = [
    V('classic', 'Klasyczne', [I('Kamień','✊','z kamieniem'), I('Papier','✋','z papierem'), I('Nożyce','✌️','z nożycami',1)], [0,2, 1,0, 2,1], ['fist','wall','two']),
    V('grecja', 'Grecja · katamaran', [I('Sztorm','⛈️','ze sztormem'), I('Kotwica','⚓','z kotwicą'), I('Katamaran','⛵','z katamaranem')], [0,2, 1,0, 2,1], ['wave','fist','roof']),
    V('portugalia', 'Portugalia', [I('Statek','🚢','ze statkiem'), I('Wieża','🏰','z wieżą'), I('Morze','🌊','z morzem')], [0,1, 1,2, 2,0], ['wall','one','wave']),
    V('narty', 'Ferie na nartach', [I('Narty','🎿','z nartami',1), I('Góra','🏔️','z górą'), I('Człowiek','🧍','z człowiekiem')], [0,1, 1,2, 2,0], ['two','roof','one']),
    V('laka', 'Wakacje na łące', [I('Marchewka','🥕','z marchewką'), I('Królik','🐇','z królikiem'), I('Norka','🕳️','z norką')], [0,2, 1,0, 2,1], ['one','two','fist']),
    V('namiot', 'Pod namiotem', [I('Kula','🔮','z kulą'), I('Namiot','⛺','z namiotem'), I('Rękawiczka','🧤','z rękawiczką')], [0,1, 1,2, 2,0], ['fist','roof','sun']),
    V('deszcz', 'Deszczowa pogoda', [I('Deszcz','🌧️','z deszczem'), I('Parasol','☂️','z parasolem'), I('Człowiek','🧍','z człowiekiem')], [0,2, 1,0, 2,1], ['wave','roof','one']),
    V('sushi', 'Kolacja sushi', [I('Sushi','🍣','z sushi'), I('Pałeczki','🥢','z pałeczkami',1), I('Człowiek','🧍','z człowiekiem')], [0,2, 1,0, 2,1], ['fist','two','one']),
    V('zima', 'Zima', [I('Śnieg','❄️','ze śniegiem'), I('Słońce','☀️','ze słońcem'), I('Okulary','🕶️','z okularami',1)], [0,2, 1,0, 2,1], ['fist','sun','two']),
    V('singapur', 'Singapur', [I('Lew morski','🦭','z lwem morskim'), I('Pożar','🔥','z pożarem'), I('Kłoda','🪵','z kłodą')], [0,1, 1,2, 2,0], ['wave','sun','wall']),
    V('bali', 'Bali', [I('Deska','🏄','z deską'), I('Człowiek','🧍','z człowiekiem'), I('Fala','🌊','z falą')], [0,2, 1,0, 2,1], ['wall','one','wave']),
    V('japonia', 'Japonia', [I('Daniel','🦌','z danielem'), I('Człowiek','🧍','z człowiekiem'), I('Samochód','🚗','z samochodem')], [0,1, 1,2, 2,0], ['sun','one','fist']),
    V('jurassic', 'Jurassic Park', [I('T-Rex','🦖','z T-Reksem'), I('Bakterie','🦠','z bakteriami',1), I('Człowiek','🧍','z człowiekiem')], [0,2, 1,0, 2,1], ['sun','fist','one']),
    V('warszawa', 'Warszawa', [I('Pałac Kultury','🗼','z Pałacem Kultury'), I('Warszawa','🏙️','z Warszawą'), I('Człowiek','🧍','z człowiekiem')], [0,1, 1,2, 2,0], ['one','wall','two']),
  ];
  VARIANTS.forEach(v => { const b = {}; for (let i = 0; i < 6; i += 2) b[v.beats[i]] = v.beats[i + 1]; v.win = b; v.classic = v.id === 'classic'; });
  const byId = id => VARIANTS.find(v => v.id === id) || VARIANTS[0];

  const WIN_TO = 3;
  const BEAT = 750;                                  // odstęp raz–dwa–trzy (wolniej)
  const WORDS = ['raz', 'dwa', 'trzy'];
  const NEXT = 2600;                                 // pokazanie wyniku przed kolejną rundą

  // =====================================================================
  //  NARZĘDZIA
  // =====================================================================
  const $ = $id;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SCREENS = ['home', 'setup', 'waiting', 'game'];
  function show(id) { SCREENS.forEach(s => $(s).classList.toggle('hidden', s !== id)); }
  function banner(t) { $('banner').textContent = t || ''; $('banner').classList.toggle('hidden', !t); }
  const lc = s => s.charAt(0).toLowerCase() + s.slice(1);

  // ---------- dźwięk ----------
  const Snd = {
    ctx: null, on: store.get('pg-sound') !== '0',
    unlock() {
      if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; } }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    tone(f, d, type = 'sine', vol = .22, at = 0, slide = 0) {
      if (!this.on || !this.ctx) return;
      const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006);
      g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
    },
    tick(i) { this.tone(i === 2 ? 1046 : 698, i === 2 ? .16 : .09, 'triangle', i === 2 ? .3 : .22); },
    whoosh() {
      if (!this.on || !this.ctx) return;
      const c = this.ctx, len = c.sampleRate * .22, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'highpass'; f.frequency.value = 1800; g.gain.value = .3;
      s.buffer = buf; s.connect(f).connect(g).connect(c.destination); s.start();
    },
    win() { [523, 659, 784].forEach((f, i) => this.tone(f, .22, 'sine', .2, i * .07)); },
    lose() { this.tone(330, .35, 'sine', .2, 0, 196); },
    draw() { this.tone(440, .16, 'sine', .15); this.tone(440, .16, 'sine', .15, .13); },
    match(w) { (w ? [523, 659, 784, 1046] : [392, 330, 262]).forEach((f, i) => this.tone(f, .3, 'sine', .2, i * .11)); }
  };
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

  // =====================================================================
  //  STAN
  // =====================================================================
  const S = {
    mode: null, choice: 'classic', variant: VARIANTS[0],
    names: { me: 'Ty', opp: 'Komputer' }, score: { me: 0, opp: 0 },
    round: 0, phase: 'idle',             // idle | pick | reveal | result | over
    me: undefined, opp: undefined,       // undefined = jeszcze nie wybrano, null = spóźnienie
    hit3: false, deadlinePassed: false,
    timers: [], raf: 0, anims: [],
    sent: false, oppLocked: {}, oppReveal: {}
  };
  const later = (fn, ms) => { const t = setTimeout(fn, ms); S.timers.push(t); return t; };
  function clearTimers() {
    S.timers.forEach(clearTimeout); S.timers = [];
    cancelAnimationFrame(S.raf); S.anims.forEach(a => { try { a.cancel(); } catch {} }); S.anims = [];
  }

  // =====================================================================
  //  HOME / SETUP
  // =====================================================================
  const myName = () => (store.get('pg-name') || '').trim();
  $('joinName').value = myName();
  if (!myName()) $('joinName').classList.remove('hidden');
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { Snd.unlock(); openSetup(b.dataset.mode); });
  $('btnJoin').onclick = () => { Snd.unlock(); joinRoom($('joinCode').value); };
  $('joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnJoin').click(); });

  const MODE_TITLE = { split: 'Jeden telefon', bot: 'Z komputerem', online: 'Online' };
  function openSetup(mode) {
    S.mode = mode;
    $('setupMode').textContent = MODE_TITLE[mode];
    $('nameWrap').classList.toggle('hidden', mode !== 'online');
    $('hostName').value = myName();
    $('btnStart').textContent = mode === 'online' ? 'Załóż pokój' : 'Graj';
    renderSetup(); show('setup');
  }
  $('setupBack').onclick = () => show('home');

  const itemVis = (v, i, big) => v.classic ? handSVG(v.g[i], 'static' + (big ? '' : ' thin')) : `<span class="e">${v.items[i].e}</span>`;

  function renderSetup() {
    const c = S.choice, seg = c === 'classic' ? 'classic' : c === 'random' ? 'random' : 'pick';
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.k === seg));
    $('vlist').classList.toggle('hidden', seg !== 'pick');
    const p = $('preview');
    if (seg === 'random') {
      p.innerHTML = `<div class="pname">Losowy wariant</div>
        <div class="tri"><div><span class="e">❔</span></div><div><span class="e">❔</span></div><div><span class="e">❔</span></div></div>
        <div class="rules">Wylosujemy jedną z ${VARIANTS.length - 1} wakacyjnych odmian.</div>`;
    } else {
      const v = byId(seg === 'classic' ? 'classic' : c);
      p.innerHTML = `<div class="pname">${v.name}</div>
        <div class="tri">${v.items.map((it, i) => `<div>${itemVis(v, i, true)}<small>${it.n}${v.classic ? '' : ' · ' + GEST_NAME[v.g[i]]}</small></div>`).join('')}</div>
        <div class="rules">${v.items.map((it, i) => `<span><b>${it.n}</b> ${it.w} ${v.items[v.win[i]].z}</span>`).join('')}</div>`;
    }
    if (seg === 'pick') {
      $('vlist').innerHTML = VARIANTS.filter(v => !v.classic).map(v =>
        `<button class="vitem${v.id === c ? ' on' : ''}" data-v="${v.id}">
          <span class="n">${v.name}</span>
          <span style="display:flex;align-items:center"><span class="em e">${v.items.map(i => i.e).join('')}</span><span class="chk">${v.id === c ? '✓' : ''}</span></span>
        </button>`).join('');
      $('vlist').querySelectorAll('.vitem').forEach(b => b.onclick = () => { S.choice = b.dataset.v; renderSetup(); });
    }
  }
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    S.choice = k === 'pick' ? ((S.choice !== 'classic' && S.choice !== 'random') ? S.choice : 'grecja') : k;
    renderSetup();
  });
  function resolveChoice(choice, avoid) {
    if (choice === 'random') { const pool = VARIANTS.filter(v => !v.classic && v.id !== avoid); return pool[rnd(pool.length)]; }
    return byId(choice);
  }
  $('btnStart').onclick = () => {
    Snd.unlock();
    S.variant = resolveChoice(S.choice);
    if (S.mode === 'online') {
      const n = $('hostName').value.trim(); if (n) store.set('pg-name', n);
      createRoom();
    } else {
      S.names = S.mode === 'split' ? { me: 'Gracz 1', opp: 'Gracz 2' } : { me: 'Ty', opp: 'Komputer' };
      startMatch();
    }
  };

  // =====================================================================
  //  GRA — widok
  // =====================================================================
  const split = () => S.mode === 'split';
  function buildOpts(el, side) {
    const v = S.variant;
    el.innerHTML = v.items.map((it, i) => `<button class="opt" data-i="${i}" disabled>
        ${itemVis(v, i)}${v.classic ? '' : handSVG(v.g[i], 'static thin tag')}<small>${it.n}</small></button>`).join('');
    el.querySelectorAll('.opt').forEach(b => b.onpointerdown = e => { e.stopPropagation(); choose(side, +b.dataset.i); });
  }
  function renderScore(bump) {
    const a = $('scMe'), b = $('scOpp');
    a.textContent = S.score.me; b.textContent = S.score.opp;
    if (bump) { const el = bump === 'me' ? a : b; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    $('ptTop').textContent = S.score.opp;
  }
  function layoutGame() {
    $('stage').classList.toggle('split', split());
    $('pTop').classList.toggle('hidden', !split());
    $('vname').textContent = S.variant.name;
    $('nmMe').textContent = S.names.me; $('nmOpp').textContent = S.names.opp;
    $('nTop').textContent = S.names.opp;
    $('hBot').innerHTML = handSVG('fist') + '<div class="badge e"></div>';
    $('hTop').innerHTML = handSVG('fist') + '<div class="badge e"></div>';
    buildOpts($('oBot'), 'me');
    if (split()) buildOpts($('oTop'), 'opp');
    renderScore();
    $('btnSound').style.opacity = Snd.on ? 1 : .35;
  }
  function setOpts(side, live) {
    const el = side === 'me' ? $('oBot') : $('oTop');
    el.querySelectorAll('.opt').forEach(b => { b.disabled = !live; b.classList.remove('sel'); });
    const veil = el.querySelector('.veil'); if (veil) veil.remove();
  }
  function markChosen(side, i) {
    const el = side === 'me' ? $('oBot') : $('oTop');
    if (split()) { const v = document.createElement('div'); v.className = 'veil'; v.textContent = 'Wybrane ✓'; el.appendChild(v); }
    else el.querySelectorAll('.opt').forEach(b => { b.disabled = true; b.classList.toggle('sel', +b.dataset.i === i); });
  }
  const handEl = side => side === 'me' ? $('hBot') : $('hTop');
  function setHand(side, i) {          // i: indeks wyboru, null = spóźnienie, undefined = pięść
    const h = handEl(side), svg = h.querySelector('.hs'), badge = h.querySelector('.badge');
    svg.dataset.g = i == null ? 'fist' : S.variant.g[i];
    const showBadge = i != null && !S.variant.classic;
    badge.textContent = showBadge ? S.variant.items[i].e : (i === null ? '⏱️' : '');
    badge.classList.toggle('on', showBadge || i === null);
  }
  function sayHTML(side, html) { $(side === 'me' ? 'sayBot' : 'sayTop').innerHTML = html; }
  function word(w) {
    const h = `<div class="word hit">${w}</div>`;
    sayHTML('me', h); if (split()) sayHTML('opp', h);
  }
  // pojedynek u góry: state 'empty' | 'wait' | 'locked' | 'mine' | 'show'
  function duel(side, state, i) {
    const k = side === 'me' ? 'Me' : 'Opp', box = $('d' + k), ic = $('ic' + k), tx = $('tx' + k);
    box.classList.remove('win', 'lose', 'pop');
    if (state === 'show' || state === 'mine') {
      ic.innerHTML = i === null ? '<span class="e">⏱️</span>' : itemVis(S.variant, i, true);
      tx.className = 'tx'; tx.textContent = i === null ? 'Za późno' : S.variant.items[i].n;
      if (state === 'show') { void box.offsetWidth; box.classList.add('pop'); }
    } else {
      ic.innerHTML = handSVG('fist', 'static');
      tx.className = 'tx wait';
      tx.textContent = state === 'locked' ? 'gotowe ✓' : state === 'wait' ? 'wybiera…' : '';
    }
  }
  function bar(ms) {
    const b = $('bar'), i = b.querySelector('i');
    if (!ms) { b.classList.remove('on'); return; }
    b.classList.add('on');
    i.style.transition = 'none'; i.style.transform = 'scaleX(1)'; void i.offsetWidth;
    i.style.transition = `transform ${ms}ms linear`; i.style.transform = 'scaleX(0)';
  }

  // =====================================================================
  //  GRA — przebieg
  // =====================================================================
  function startMatch(keepScore) {
    clearTimers();
    if (!keepScore) { S.score = { me: 0, opp: 0 }; S.round = 0; }
    S.phase = 'idle';
    $('over').classList.add('hidden');
    layoutGame();
    setOpts('me', false); setOpts('opp', false); bar(0);
    duel('me', 'empty'); duel('opp', 'empty');
    const intro = `<div class="hint">${esc(S.variant.name)} · do ${WIN_TO} punktów</div>`;
    sayHTML('me', intro); sayHTML('opp', split() ? intro : '');
    show('game');
    if (S.mode !== 'online' || isHost) later(kickoff, 1100);
  }
  function kickoff() {
    if (S.phase === 'over') return;
    const r = S.round + 1;
    if (S.mode === 'online') send({ t: 'go', r });
    startRound(r);
  }

  function startRound(r) {
    clearTimers();
    S.round = r; S.phase = 'pick';
    S.me = undefined; S.opp = undefined; S.open = false; S.deadlinePassed = false; S.sent = false;
    if (S.mode === 'online' && r in S.oppReveal) S.opp = S.oppReveal[r];   // rywal mógł być szybszy
    $('tapnext').classList.remove('on');
    ['me', 'opp'].forEach(s => { setHand(s, undefined); handEl(s).classList.remove('lost'); });
    setOpts('me', false); setOpts('opp', false); bar(0);
    duel('me', 'empty');
    duel('opp', split() ? 'empty' : (S.oppLocked[r] ? 'locked' : 'wait'));
    sayHTML('me', ''); if (split()) sayHTML('opp', '');
    later(countdown, 300);
  }

  // Jeden zegar dla ruchu ręki, słów i linii czasu. Uderzenie w dół = słowo.
  // Linia czasu startuje razem z ręką; „trzy” wypada dokładnie w jej połowie.
  function countdown() {
    const D = 3 * BEAT, total = 2 * D;
    const up = 'translateY(-34px) rotate(-10deg)', down = 'translateY(0) rotate(0)';
    const eUp = 'cubic-bezier(.2,.7,.3,1)', eDown = 'cubic-bezier(.65,0,.95,.45)';
    const frames = [
      { transform: down, offset: 0, easing: eUp }, { transform: up, offset: 1 / 6, easing: eDown },
      { transform: down, offset: 2 / 6, easing: eUp }, { transform: up, offset: 3 / 6, easing: eDown },
      { transform: down, offset: 4 / 6, easing: eUp }, { transform: up, offset: 5 / 6, easing: eDown },
      { transform: down, offset: 1 }
    ];
    const hands = split() ? [$('hBot'), $('hTop')] : [$('hBot')];
    S.anims = hands.map(h => h.animate(frames, { duration: D, easing: 'linear' }));
    setOpts('me', true); if (split()) setOpts('opp', true);
    bar(total);
    if (S.mode === 'bot') later(() => choose('opp', rnd(3)), 400 + rnd(D + 900));
    later(onDeadline, total);
    const lead = S.anims[0];
    let fired = 0;
    const loop = () => {
      const t = lead.currentTime == null ? D : lead.currentTime;
      while (fired < 3 && t >= (fired + 1) * BEAT - 8) { onBeat(fired); fired++; }
      if (fired < 3) S.raf = requestAnimationFrame(loop);
    };
    S.raf = requestAnimationFrame(loop);
  }

  function onBeat(i) {
    word(WORDS[i] + (i === 2 ? '!' : '')); Snd.tick(i); buzz(i === 2 ? 18 : 8);
    if (i < 2) return;
    // TRZY — kto już wybrał, temu dłoń otwiera się teraz; reszta w chwili naciśnięcia
    S.open = true;
    if (S.me !== undefined) setHand('me', S.me);
    if (split() && S.opp !== undefined) setHand('opp', S.opp);
    later(checkDone, 450);
  }

  function choose(side, i) {
    if (S.phase !== 'pick' || S.deadlinePassed) return;
    Snd.unlock();
    if (side === 'me') {
      if (S.me !== undefined) return;
      S.me = i; markChosen('me', i); buzz(12);
      if (S.open) setHand('me', i);                      // po „trzy” dłoń otwiera się od razu
      if (!split()) duel('me', 'mine', i);
      if (S.mode === 'online') { send({ t: 'lock', r: S.round }); tryReveal(); }
    } else {
      if (S.opp !== undefined) return;
      S.opp = i;
      if (split()) { markChosen('opp', i); buzz(12); if (S.open) setHand('opp', i); }
      else duel('opp', 'locked');
    }
    if (S.open) later(checkDone, 350);
  }

  function onDeadline() {
    if (S.phase !== 'pick') return;
    S.deadlinePassed = true;
    if (S.me === undefined) { S.me = null; setOpts('me', false); }
    if (S.mode !== 'online' && S.opp === undefined) { S.opp = null; setOpts('opp', false); }
    if (S.mode === 'online') { tryReveal(); if (!isDone()) { $('txOpp').textContent = 'czekam…'; } }
    checkDone();
  }
  const isDone = () => S.me !== undefined && S.opp !== undefined && (S.mode !== 'online' || S.sent);
  function checkDone() {
    if (S.phase !== 'pick' || !S.open || !isDone()) return;
    clearTimers(); reveal();
  }

  function outcome(me, opp) {
    if (me === null && opp === null) return 'none';
    if (me === null) return 'opp';
    if (opp === null) return 'me';
    if (me === opp) return 'draw';
    return S.variant.win[me] === opp ? 'me' : 'opp';
  }

  function reveal() {
    S.phase = 'reveal';
    setOpts('me', false); setOpts('opp', false); bar(0);
    const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    Snd.whoosh();
    const v = S.variant, it = v.items, w = outcome(S.me, S.opp);
    setTimeout(() => {
      setHand('me', S.me);
      if (split()) setHand('opp', S.opp);
      duel('me', 'show', S.me); duel('opp', 'show', S.opp);
      if (w === 'me') { S.score.me++; $('dMe').classList.add('win'); $('dOpp').classList.add('lose'); if (split()) handEl('opp').classList.add('lost'); }
      if (w === 'opp') { S.score.opp++; $('dOpp').classList.add('win'); $('dMe').classList.add('lose'); handEl('me').classList.add('lost'); }
      renderScore(w === 'me' ? 'me' : w === 'opp' ? 'opp' : null);

      // DUŻY napis: co z czym wygrywa
      let verdict;
      if (w === 'none') verdict = 'Oboje za późno';
      else if (S.me === null) verdict = split() ? `${S.names.me}: za późno!` : 'Za późno!';
      else if (S.opp === null) verdict = `${S.names.opp}: za późno!`;
      else if (w === 'draw') verdict = `Remis — oboje: ${lc(it[S.me].n)}`;
      else { const a = w === 'me' ? it[S.me] : it[S.opp], b = w === 'me' ? it[S.opp] : it[S.me]; verdict = `${a.n} ${a.w} ${b.z}`; }

      const pointLine = side => {
        if (w === 'draw' || w === 'none') return `<div class="point neutral">Bez punktu</div>`;
        if (w === side) return `<div class="point">+1 dla Ciebie</div>`;
        return `<div class="point neutral">+1 ${esc(S.names[side === 'me' ? 'opp' : 'me'])}</div>`;
      };
      const block = side => `<div class="verdict">${esc(verdict)}</div>${pointLine(side)}`;
      sayHTML('me', block('me'));
      if (split()) sayHTML('opp', block('opp'));

      if (w === 'me') { Snd.win(); buzz([20, 40, 20]); }
      else if (w === 'opp') split() ? Snd.win() : Snd.lose();
      else Snd.draw();

      if (S.score.me >= WIN_TO || S.score.opp >= WIN_TO) { S.phase = 'over'; later(showOver, 1500); }
      else {
        S.phase = 'result';
        later(() => $('tapnext').classList.add('on'), 700);
        if (S.mode !== 'online' || isHost) later(kickoff, NEXT);
      }
    }, 60);
  }

  // dotknięcie w dowolnym miejscu podczas wyniku = następna runda
  $('game').addEventListener('pointerdown', e => {
    if (S.phase !== 'result' || e.target.closest('.icon-btn')) return;
    Snd.unlock();
    if (S.mode === 'online' && !isHost) { send({ t: 'skip', r: S.round }); return; }
    clearTimers(); kickoff();
  });

  function showOver() {
    const meWon = S.score.me > S.score.opp;
    $('overTitle').textContent = split() ? `Wygrywa ${meWon ? S.names.me : S.names.opp}` : (meWon ? 'Wygrywasz!' : `Wygrywa ${S.names.opp}`);
    $('overScore').innerHTML = `${S.score.me}<span>:</span>${S.score.opp}`;
    $('overText').textContent = S.variant.name;
    $('over').classList.remove('hidden');
    Snd.match(split() || meWon);
  }
  function newMatch(random) {
    if (S.mode === 'online' && !isHost) { send({ t: 'again', random }); $('over').classList.add('hidden'); return; }
    if (random) S.variant = resolveChoice('random', S.variant.id);
    startMatch();
    if (S.mode === 'online') sendCfg();
  }
  $('btnAgain').onclick = () => newMatch(false);
  $('btnAgainRandom').onclick = () => newMatch(true);
  $('btnMenu').onclick = () => quit();
  $('btnQuit').onclick = () => { if (S.phase === 'over' || S.round === 0 || confirm('Wyjść z gry?')) quit(); };
  $('btnSound').onclick = () => {
    Snd.on = !Snd.on; store.set('pg-sound', Snd.on ? '1' : '0');
    $('btnSound').style.opacity = Snd.on ? 1 : .35; Snd.unlock(); Snd.tick(0);
  };
  function quit() {
    clearTimers(); leaveNet(); S.phase = 'idle';
    $('over').classList.add('hidden'); banner('');
    history.replaceState(null, '', location.pathname);
    show('home');
  }

  // =====================================================================
  //  ONLINE (PeerJS — serwer tylko „przedstawia” telefony, potem P2P)
  // =====================================================================
  const PREFIX = 'palmgames-kpn-';
  const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let peer = null, conn = null, isHost = false, code = null, retryTimer = null, leaving = false;
  const randomCode = () => { let c = ''; for (let i = 0; i < 4; i++) c += ALPH[rnd(ALPH.length)]; return c; };

  function createRoom() {
    leaveNet(); leaving = false;
    isHost = true; code = randomCode();
    S.names = { me: myName() || 'Ty', opp: 'Gość' };
    $('roomCode').textContent = code;
    $('waitStatus').innerHTML = 'Łączę z serwerem<span class="dots"></span>';
    $('btnShare').textContent = 'Wyślij link';
    show('waiting');
    peer = new Peer(PREFIX + code);
    peer.on('open', () => { $('waitStatus').innerHTML = 'Czekam na drugą osobę<span class="dots"></span>'; });
    peer.on('connection', c => {
      if (conn && conn.open) { c.on('open', () => { c.send({ t: 'full' }); setTimeout(() => c.close(), 300); }); return; }
      attach(c);
    });
    peer.on('disconnected', () => { if (!leaving) setTimeout(() => peer && !peer.destroyed && peer.reconnect(), 1000); });
    peer.on('error', e => {
      if (e.type === 'unavailable-id') { createRoom(); return; }
      $('waitStatus').textContent = 'Problem z połączeniem (' + e.type + ')';
    });
    history.replaceState(null, '', location.pathname);
  }

  function joinRoom(c) {
    c = (c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length !== 4) { $('homeErr').textContent = 'Kod ma 4 znaki.'; return; }
    const n = $('joinName').value.trim(); if (n) store.set('pg-name', n);
    if (!myName()) { $('joinName').classList.remove('hidden'); $('joinName').focus(); $('homeErr').textContent = 'Podaj imię.'; return; }
    leaveNet(); leaving = false;
    isHost = false; code = c; S.mode = 'online';
    S.names = { me: myName(), opp: 'Gospodarz' };
    $('homeErr').textContent = 'Łączę…';
    peer = new Peer();
    peer.on('open', connectToHost);
    peer.on('disconnected', () => { if (!leaving) setTimeout(() => peer && !peer.destroyed && peer.reconnect(), 1000); });
    peer.on('error', e => {
      const inGame = !$('game').classList.contains('hidden');
      if (e.type === 'peer-unavailable') { if (inGame) scheduleRetry(); else $('homeErr').textContent = `Nie ma pokoju ${code}.`; }
      else if (!inGame) $('homeErr').textContent = 'Błąd połączenia (' + e.type + ').';
    });
  }
  function connectToHost() { clearTimeout(retryTimer); attach(peer.connect(PREFIX + code, { reliable: true })); }
  function scheduleRetry() {
    clearTimeout(retryTimer);
    if (leaving || isHost) return;
    retryTimer = setTimeout(() => {
      if (!peer || peer.destroyed) return;
      if (peer.disconnected) { peer.reconnect(); scheduleRetry(); } else connectToHost();
    }, 2500);
  }
  function attach(c) {
    conn = c;
    c.on('open', () => {
      if (conn !== c) return;
      banner(''); $('homeErr').textContent = '';
      c.send({ t: 'hello', name: S.names.me });
      if (isHost) { startMatch($('waiting').classList.contains('hidden')); sendCfg(); }
    });
    c.on('data', onData);
    c.on('close', () => {
      if (conn !== c || leaving) return;
      clearTimers(); S.phase = 'idle';
      banner(isHost ? 'Druga osoba się rozłączyła — czekam…' : 'Połączenie zerwane — łączę ponownie…');
      if (!isHost) scheduleRetry();
    });
    c.on('error', () => { if (!isHost) scheduleRetry(); });
  }
  function send(m) { if (conn && conn.open) conn.send(m); }
  function leaveNet() {
    leaving = true; clearTimeout(retryTimer);
    try { conn && conn.close(); } catch {}
    try { peer && peer.destroy(); } catch {}
    conn = null; peer = null;
  }
  // gospodarz jest „sędzią”: wysyła wariant i wynik, startuje rundy
  function sendCfg() { send({ t: 'cfg', v: S.variant.id, me: S.score.opp, opp: S.score.me, round: S.round, name: S.names.me }); }
  function tryReveal() {
    if (S.sent || S.me === undefined) return;
    if (S.oppLocked[S.round] || (S.round in S.oppReveal) || S.deadlinePassed) {
      S.sent = true; send({ t: 'reveal', r: S.round, c: S.me });
    }
  }
  function onData(m) {
    if (!m || typeof m !== 'object') return;
    switch (m.t) {
      case 'hello':
        S.names.opp = String(m.name || (isHost ? 'Gość' : 'Gospodarz')).slice(0, 16);
        $('nmOpp').textContent = S.names.opp; $('nTop').textContent = S.names.opp;
        break;
      case 'full':
        quit(); $('homeErr').textContent = 'Ten pokój jest już pełny.';
        break;
      case 'cfg':
        S.variant = byId(m.v);
        if (m.name) S.names.opp = String(m.name).slice(0, 16);
        S.score = { me: m.me | 0, opp: m.opp | 0 }; S.round = m.round | 0;
        startMatch(true);
        break;
      case 'go':
        if (!isHost) startRound(m.r);
        break;
      case 'skip':
        if (isHost && S.phase === 'result' && m.r === S.round) { clearTimers(); kickoff(); }
        break;
      case 'again':
        if (isHost) newMatch(!!m.random);
        break;
      case 'lock':
        S.oppLocked[m.r] = true;
        if (m.r === S.round) { if (S.phase === 'pick') duel('opp', 'locked'); tryReveal(); checkDone(); }
        break;
      case 'reveal': {
        const c = m.c === null ? null : (m.c >= 0 && m.c <= 2 ? m.c | 0 : null);
        S.oppReveal[m.r] = c;
        if (m.r === S.round && S.phase === 'pick') { S.opp = c; tryReveal(); checkDone(); }
        break;
      }
    }
  }
  $('waitBack').onclick = quit;
  $('btnShare').onclick = async () => {
    const url = location.origin + location.pathname + '?pokoj=' + code;
    const text = `Zagraj ze mną — palm games (${S.variant.name.toLowerCase()}). Kod: ${code}`;
    if (navigator.share) { try { await navigator.share({ title: 'palm games', text, url }); } catch {} }
    else {
      try { await navigator.clipboard.writeText(url); $('btnShare').textContent = 'Skopiowano ✓'; }
      catch { prompt('Skopiuj link:', url); }
    }
  };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !peer || leaving) return;
    if (peer.disconnected && !peer.destroyed) peer.reconnect();
    if (!isHost && !(conn && conn.open)) scheduleRetry();
  });
  const fromLink = new URLSearchParams(location.search).get('pokoj');
  if (fromLink) {
    $('joinCode').value = fromLink.toUpperCase();
    if (myName()) joinRoom(fromLink);
    else { $('joinName').classList.remove('hidden'); $('homeErr').textContent = 'Podaj imię i dołącz.'; }
  }
})();
</script>
</body>
</html>
